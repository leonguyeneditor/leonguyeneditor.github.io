<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Trader Reset</title>
  <meta name="description" content="Trader Reset demo: a trading journal that keeps your data in your own browser.">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="icon" href="favicon-64.png" type="image/png" sizes="64x64">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700;800&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css?v=202611111300">
  <script>
    // Áp giao diện sáng/tối ngay khi mở trang, tránh bị nháy màu
    (function () {
      var light = false, collapsed = false;
      try { light = localStorage.getItem('rj-theme') === 'light'; collapsed = localStorage.getItem('rj-sidebar') === 'collapsed'; } catch (e) {}
      document.documentElement.dataset.theme = light ? 'light' : 'dark';
      // Nhớ menu đang thu gọn hay mở, áp ngay để không bị nháy
      if (collapsed) document.documentElement.classList.add('side-collapsed');
    })();
  </script>
</head>
<body>
  <div class="layout">
    <!-- Sidebar (máy tính) -->
    <aside class="sidebar">
      <div class="side-top">
        <a href="#/" class="brand">
          <span class="brand-mark" aria-hidden="true"></span>
          <span><b>TRADER <span>RESET</span></b><small>Journal</small></span>
        </a>
        <!-- Nút thu gọn / mở rộng menu (giống nút « trong ảnh TradeZella) -->
        <button type="button" class="side-toggle" id="side-toggle" aria-label="Collapse menu" aria-expanded="true">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M11 17l-5-5 5-5M18 17l-5-5 5-5"/></svg>
        </button>
      </div>
      <a href="#/new" class="btn btn-primary btn-block">+ New trade</a>
      <nav class="side-nav" aria-label="Main">
        <a href="#/" data-nav="dashboard" title="Dashboard"><svg viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg>Dashboard</a>
        <a href="#/daily" data-nav="daily" title="Daily Journal"><svg viewBox="0 0 24 24"><path d="M5 5a2 2 0 0 1 2-2h12v15H7a2 2 0 0 0-2 2z"/><path d="M5 20a2 2 0 0 0 2 1h12v-3M9 7h6M9 11h4"/></svg>Daily Journal</a>
        <a href="#/trades" data-nav="trades" title="Trades"><svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M3 15l5-5 4 4 3-3 6 6"/></svg>Trades</a>
        <a href="#/models" data-nav="models" title="Models"><svg viewBox="0 0 24 24"><path d="M12 3l8 4.5-8 4.5-8-4.5z"/><path d="M4 12l8 4.5 8-4.5M4 16.5l8 4.5 8-4.5"/></svg>Models</a>
        <a href="#/accounts" data-nav="accounts" title="Accounts"><svg viewBox="0 0 24 24"><rect x="3" y="6" width="18" height="13" rx="2"/><path d="M3 10h18M16 15h2"/></svg>Accounts</a>
        <a href="#/notebook" data-nav="notebook" title="Notebook"><svg viewBox="0 0 24 24"><rect x="5" y="3" width="14" height="18" rx="2"/><path d="M9 7h6M9 11h6M9 15h4"/></svg>Notebook</a>
      </nav>
      <p class="tagline">RESET YOUR MIND.<br>REBUILD YOUR SYSTEM.</p>
      <nav class="side-nav side-bottom" aria-label="Settings">
        <a href="#/settings" data-nav="settings" title="Settings"><svg viewBox="0 0 24 24"><path d="M4 7h10M18 7h2M4 17h4M12 17h8"/><circle cx="16" cy="7" r="2"/><circle cx="10" cy="17" r="2"/></svg>Settings</a>
      </nav>
    </aside>

    <div class="main-col">
      <header class="topbar">
        <a href="#/" class="brand brand-mobile"><b>TRADER <span>RESET</span></b></a>
        <nav class="crumbs" id="crumbs" aria-label="Breadcrumb"></nav>
        <a href="#/settings" class="btn btn-soft theme-btn settings-mobile" aria-label="Settings"><svg viewBox="0 0 24 24"><path d="M4 7h10M18 7h2M4 17h4M12 17h8"/><circle cx="16" cy="7" r="2"/><circle cx="10" cy="17" r="2"/></svg></a>
        <form class="search" id="search" role="search">
          <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg>
          <input type="search" placeholder="Search trades…" aria-label="Search trades">
        </form>
        <select id="scope" class="scope" aria-label="Which accounts to show"></select>
        <button type="button" class="btn btn-soft theme-btn" id="theme-toggle" aria-label="Switch light or dark mode">
          <svg class="moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z"/></svg>
          <svg class="sun" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
        </button>
        <a href="#/new" class="btn btn-primary btn-plus" aria-label="New trade">+</a>
      </header>
      <div id="stop-banner" class="stop-banner" hidden>
        <strong>STOP.</strong> 2 losses in a row today. Close the charts. Your session is over.
      </div>
      <main id="app"></main>
    </div>
  </div>

  <!-- Menu đáy (điện thoại) -->
  <nav class="bottom-nav" aria-label="Main">
    <a href="#/" data-nav="dashboard"><svg viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg>Dashboard</a>
    <a href="#/daily" data-nav="daily"><svg viewBox="0 0 24 24"><path d="M5 5a2 2 0 0 1 2-2h12v15H7a2 2 0 0 0-2 2z"/><path d="M5 20a2 2 0 0 0 2 1h12v-3M9 7h6M9 11h4"/></svg>Daily</a>
    <a href="#/trades" data-nav="trades"><svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M3 15l5-5 4 4 3-3 6 6"/></svg>Trades</a>
    <a href="#/models" data-nav="models"><svg viewBox="0 0 24 24"><path d="M12 3l8 4.5-8 4.5-8-4.5z"/><path d="M4 12l8 4.5 8-4.5M4 16.5l8 4.5 8-4.5"/></svg>Models</a>
    <a href="#/accounts" data-nav="accounts"><svg viewBox="0 0 24 24"><rect x="3" y="6" width="18" height="13" rx="2"/><path d="M3 10h18M16 15h2"/></svg>Accounts</a>
    <a href="#/notebook" data-nav="notebook"><svg viewBox="0 0 24 24"><rect x="5" y="3" width="14" height="18" rx="2"/><path d="M9 7h6M9 11h6M9 15h4"/></svg>Notebook</a>
  </nav>
  <!-- local-api.js: "server" chạy trong trình duyệt cho bản demo (phải nạp trước script.js) -->
  <script src="local-api.js?v=202611111300"></script>
  <script src="i18n.js?v=202611111300"></script>
  <script src="script.js?v=202611111300"></script>
</body>
</html>
