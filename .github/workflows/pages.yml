# Đăng trang lên GitHub Pages.
# - Push nhiều lần liên tiếp: các lần sau XẾP HÀNG chờ, không huỷ lần đang đăng.
# - Repo traderreset hay bị GitHub "khoá" 15–25 phút sau mỗi lần đăng ("in progress deployment"),
#   nên bước đăng TỰ THỬ LẠI tới 5 lần: ngay, +3, +5, +8, +10 phút (tổng ~26 phút) rồi mới báo lỗi.
name: Deploy site
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment:
      name: github-pages
      url: ${{ steps.try5.outputs.page_url || steps.try4.outputs.page_url || steps.try3.outputs.page_url || steps.try2.outputs.page_url || steps.try1.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: try1
        uses: actions/deploy-pages@v4
        continue-on-error: true
      - if: steps.try1.outcome == 'failure'
        run: sleep 180
      - id: try2
        if: steps.try1.outcome == 'failure'
        uses: actions/deploy-pages@v4
        continue-on-error: true
      - if: steps.try2.outcome == 'failure'
        run: sleep 300
      - id: try3
        if: steps.try2.outcome == 'failure'
        uses: actions/deploy-pages@v4
        continue-on-error: true
      - if: steps.try3.outcome == 'failure'
        run: sleep 480
      - id: try4
        if: steps.try3.outcome == 'failure'
        uses: actions/deploy-pages@v4
        continue-on-error: true
      - if: steps.try4.outcome == 'failure'
        run: sleep 600
      - id: try5
        if: steps.try4.outcome == 'failure'
        uses: actions/deploy-pages@v4
